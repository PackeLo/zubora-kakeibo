name = "zubora-kakeibo"
account_id = "d0ceef702a503866c806d0020a7ec4ad"
main = "app/back/src/worker/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[secrets]
required = ["GPT_ACTION_TOKEN", "ADMIN_EMAILS", "HOUSEHOLD_EMAILS", "CF_ACCESS_TEAM_DOMAIN", "CF_ACCESS_AUD"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "./app/front/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/authorize", "/oauth/*", "/.well-known/*"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "6c085821bc384b4d8b60d9f18e5e2416"

[[d1_databases]]
